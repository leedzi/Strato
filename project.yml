name: Strato
options:
  bundleIdPrefix: com.strato
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GoogleMaps3D:
    url: https://github.com/googlemaps/ios-maps-3d-sdk
    exactVersion: "1.0.0"

targets:
  Strato:
    type: application
    platform: iOS
    sources:
      - path: Strato
      - path: Shared
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strato.focus
        INFOPLIST_FILE: Strato/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: GoogleMaps3D
        product: GoogleMaps3D
      - target: StratoWidget
        embed: true

  StratoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StratoWidget
      - path: Shared
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strato.focus.widget
        INFOPLIST_FILE: StratoWidget/Info.plist
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  StratoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strato.focus.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Strato
    dependencies:
      - target: Strato

schemes:
  Strato:
    build:
      targets:
        Strato: all
        StratoWidget: all
        StratoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StratoUITests
    archive:
      config: Release
