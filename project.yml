name: Strato
options:
  bundleIdPrefix: com.strato
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Strato:
    type: application
    platform: iOS
    sources:
      - path: Strato
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strato.focus
        INFOPLIST_FILE: Strato/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: StratoWidget
        embed: true

  StratoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StratoWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.strato.focus.widget
        INFOPLIST_FILE: StratoWidget/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  Strato:
    build:
      targets:
        Strato: all
        StratoWidget: all
    run:
      config: Debug
    archive:
      config: Release
