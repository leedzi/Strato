name: Core tests

on:
  push:
    branches: [ v3 ]
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (platform-independent logic)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Validate bundled reference data
        run: python3 -I Scripts/data/build_reference_data.py --validate-only --out Strato/Resources/Data --spot
      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: |
          grep -E "error:|warning: unre|failed|Executed" test.log | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-log
          path: test.log
          retention-days: 14
