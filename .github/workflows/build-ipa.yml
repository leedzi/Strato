name: Build Strato Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA (LiveContainer & Full Widget)
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Strato (Unsigned Release)
        run: |
          xcodebuild clean build \
            -project Strato.xcodeproj \
            -scheme Strato \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Full IPA (SideStore Native Slot with Widget & Live Activity)
        run: |
          mkdir -p build/Full/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Strato.app build/Full/Payload/Strato.app
          cd build/Full
          zip -qry ../Strato-Full-WithWidget.ipa Payload

      - name: Package LiveContainer IPA (No PlugIns for direct LC import)
        run: |
          mkdir -p build/LC/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Strato.app build/LC/Payload/Strato.app
          rm -rf build/LC/Payload/Strato.app/PlugIns
          cd build/LC
          zip -qry ../Strato-LiveContainer.ipa Payload
          ls -lh ../Strato-LiveContainer.ipa ../Strato-Full-WithWidget.ipa

      - name: Upload Strato-LiveContainer.ipa (For LiveContainer)
        uses: actions/upload-artifact@v4
        with:
          name: Strato-LiveContainer-ipa
          path: build/Strato-LiveContainer.ipa
          retention-days: 30

      - name: Upload Strato-Full-WithWidget.ipa (For SideStore Native)
        uses: actions/upload-artifact@v4
        with:
          name: Strato-Full-WithWidget-ipa
          path: build/Strato-Full-WithWidget.ipa
          retention-days: 30
